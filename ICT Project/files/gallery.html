<!-- This part of code is for HTML document structure part -->
<!DOCTYPE html>
<html lang="en">
<!-- This part of code is for head section part -->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery — Elite Fitness GYM</title>
  <link rel="stylesheet" href="gym.css">
</head>
<!-- This part of code is for body section part -->
<body>
  <!-- This part of code is for header section part -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="GYM.html">Elite Fitness<span class="accent">GYM</span></a>
      <nav class="nav" id="nav">
        <a href="GYM.html"><span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 11.5L12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11.5z" fill="currentColor"/></svg>
        </span>Home</a>
        <a href="about.html"><span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" fill="currentColor"/></svg>
        </span>About Us</a>
        <a href="gallery.html" class="active" aria-current="page"><span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14h18zM8.5 13.5l2-2 3 4H5l3.5-2z" fill="currentColor"/></svg>
        </span>Gallery</a>
        <a href="team.html"><span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z" fill="currentColor"/></svg>
        </span>Team</a>
        <a href="contact.html"><span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 6.5V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6.5L12 13 2 6.5zM22 5H2l10 7 10-7z" fill="currentColor"/></svg>
        </span>Contact</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <!-- This part of code is for main content section part -->
  <main class="page-main">
    <div class="container">
      <h2>Gallery</h2>
      <p class="muted">Some snapshots from our gym.</p>
      <!-- This part of code is for gallery grid section part -->
      <div class="gallery-grid" style="margin-top:18px">
        <figure>
          <img src="../images/1.jpg" alt="Gym floor" loading="lazy">
          <figcaption>Spacious gym floor with squat racks and platforms</figcaption>
        </figure>
        <figure>
          <img src="../images/2.jpg" alt="Treadmills" loading="lazy">
          <figcaption>Cardio treadmill area for endurance training</figcaption>
        </figure>
        <figure>
          <img src="../images/3.jpg" alt="Dumbbells" loading="lazy">
          <figcaption>Dumbbells and free weights for strength training</figcaption>
        </figure>
        <figure>
          <img src="../images/4.jpg" alt="Powerlifting" loading="lazy">
          <figcaption>Athlete performing heavy lifting in the powerlifting area</figcaption>
        </figure>
        <figure>
          <img src="../images/5.jpg" alt="Dumbbell racks" loading="lazy">
          <figcaption>Dumbbell racks and functional training zone</figcaption>
        </figure>
        <figure>
          <img src="../images/6.jpg" alt="Machines" loading="lazy">
          <figcaption>Modern cardio and strength machines</figcaption>
        </figure>
        <figure>
          <img src="../images/7.jpg" alt="Studio" loading="lazy">
          <figcaption>Dedicated studio area for classes and coaching</figcaption>
        </figure>
        <figure>
          <img src="../images/8.jpg" alt="Weight plates" loading="lazy">
          <figcaption>Colorful weight plates and organized racks</figcaption>
        </figure>
      </div>

      <!-- This part of code is for lightbox section part -->
      <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer">
        <button class="lb-close" aria-label="Close lightbox">&times;</button>
        <button class="lb-prev" aria-label="Previous image">&lsaquo;</button>
        <div class="lb-image-wrap">
          <img id="lightbox-img" src="" alt="">
          <p id="lightbox-caption" class="lb-caption"></p>
        </div>
        <button class="lb-next" aria-label="Next image">&rsaquo;</button>
      </div>
    </div>
  </main>

  <!-- This part of code is for footer section part -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 EliteFitnessGYM — All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
